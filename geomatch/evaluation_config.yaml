# Evaluation config for geomatch/evaluation_pipeline.py
#
# Run from the repository root:
#   python -m geomatch.evaluation_pipeline                                  # uses this file
#   python -m geomatch.evaluation_pipeline --config path/to/other.yaml      # another experiment
#
# For a new experiment: copy this file, change it, give it a new `name`.
# Results are saved to geomatch/results/<name>_<timestamp>/.

name: kitti06_baseline

# ---------- which images ----------
dataset:
  video: data/videos/kitti06/video_color.mp4      # paths are relative to the repo root
  poses: data/videos/kitti06/06.txt               # KITTI format: 3x4 camera-to-world per frame
  intrinsics: {fx: 707.0912, fy: 707.0912, cx: 601.8873, cy: 183.1104}   # settings/KITTI04-12.yaml
  pairs:                     # image pairs (s, s + gap) for s = start, start + step, ... < stop
    start: 50                # frames 0-5 have a slightly wrong ground-truth rotation
    stop: 1050
    step: 100
    gap: 10                  # frames between the two images (bigger = harder)

# ---------- depth prediction ----------
depth:
  model: depth-anything/DA3METRIC-LARGE

# ---------- grading ----------
grading:
  correct_px: 4.0            # a match is correct if its error is below this (pixels)

# ---------- methods to compare ----------
# Every method runs on every pair. Each one is a descriptor, a matcher and a filter.
# `type` picks the method by its registry name; all other keys are passed to it as parameters.
#   descriptor types: see descriptors.py   (rootsift, rootsift_depth)
#   matcher types:    see matchers.py      (nn_ratio)
#   filter types:     see filtering.py     (none, depth_valid, desc_threshold,
#                                           relative_depth_threshold, gt_epipolar)
#   every filter also takes  ransac: none | before | after
methods:
  - name: sift                                   # appearance-only baseline
    descriptor: {type: rootsift}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: none}

  - name: sift_ransac                            # classic outlier rejection
    descriptor: {type: rootsift}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: none, ransac: after}

  - name: sift_depth_w0.3                        # WP2: depth-aware descriptor
    descriptor: {type: rootsift_depth, w: 0.3}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: none}

  - name: sift_reldepth0.2                       # WP3: depth-based filter
    descriptor: {type: rootsift}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: relative_depth_threshold, rel_depth_thresh: 0.2}

  - name: sift_depth_w0.3_reldepth0.2_ransac     # WP2 + WP3 + RANSAC combined
    descriptor: {type: rootsift_depth, w: 0.3}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: relative_depth_threshold, rel_depth_thresh: 0.2, ransac: after}

  - name: sift_oracle                            # REFERENCE ONLY: uses the ground truth
    descriptor: {type: rootsift}
    matcher:    {type: nn_ratio, ratio: 0.8}
    filter:     {type: gt_epipolar, err_px: 4.0}
